# Rebuilds the lists the site's email checker downloads (known phishing and
# malware hosts, popular sites) and publishes them on the `checker-data`
# branch, replaced on every run so the repository does not grow.
name: Checker lists

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checker-lists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: python scripts/build_checker_lists.py "$RUNNER_TEMP/checker-data"
      - name: Publish on the checker-data branch
        working-directory: ${{ runner.temp }}/checker-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b checker-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Checker lists $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" checker-data

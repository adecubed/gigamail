name: Desktop build

# Builda l'installer NSIS su Windows, lo installa in silenzio e verifica che
# l'app impacchettata abbia tutto: exe, Python embedded, codice del repo.
# La recensione esterna aveva ragione: la CI validava il Python ma nessuno
# provava mai l'installer — questo workflow chiude quel buco.

on:
  push:
    branches: [main]
    paths:
      - "console/**"
      - "pyproject.toml"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "console/**"
      - "pyproject.toml"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Dipendenze console (ABI Electron, non Node)
        working-directory: console
        # better-sqlite3 non va compilato per Node (servirebbe Visual Studio):
        # install-app-deps scarica il prebuilt per la ABI di Electron.
        run: |
          npm ci --ignore-scripts
          npx electron-builder install-app-deps

      - name: Python embedded
        run: powershell -ExecutionPolicy Bypass -File console/prepare-python.ps1

      - name: Build installer
        working-directory: console
        run: npm run dist

      - name: La versione dell'installer segue pyproject.toml
        shell: pwsh
        run: |
          $ver = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $exe = "console/dist/GigaMail Setup $ver.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem console/dist
            throw "installer atteso non trovato: $exe"
          }
          Write-Host "OK: $exe"

      - name: Installazione silenziosa e verifica contenuti
        shell: pwsh
        run: |
          $ver = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Start-Process -Wait -FilePath "console/dist/GigaMail Setup $ver.exe" -ArgumentList "/S"
          $dir = Join-Path $env:ProgramFiles "GigaMail"
          if (-not (Test-Path $dir)) { $dir = Join-Path ${env:ProgramFiles(x86)} "GigaMail" }
          foreach ($p in @("GigaMail.exe", "resources\python\python.exe", "resources\gigamail\src\ade_mail_agent")) {
            if (-not (Test-Path (Join-Path $dir $p))) {
              Get-ChildItem $dir -Recurse -Depth 2 | Select-Object FullName
              throw "manca $p in $dir"
            }
          }
          Write-Host "install OK: $dir"

      - name: Il backend impacchettato si importa
        shell: pwsh
        # Stesso layout che usa main.js da packaged: codice del repo in
        # resources\gigamail\src, dipendenze nel site-packages embedded.
        run: |
          $dir = Join-Path $env:ProgramFiles "GigaMail"
          if (-not (Test-Path $dir)) { $dir = Join-Path ${env:ProgramFiles(x86)} "GigaMail" }
          $env:PYTHONPATH = Join-Path $dir "resources\gigamail\src"
          & (Join-Path $dir "resources\python\python.exe") -c "import ade_mail_agent, fastapi, uvicorn, mcp; print('backend import OK')"
          if ($LASTEXITCODE -ne 0) { throw "import fallito" }

      - name: Disinstallazione silenziosa
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles "GigaMail"
          if (-not (Test-Path $dir)) { $dir = Join-Path ${env:ProgramFiles(x86)} "GigaMail" }
          $unins = Get-ChildItem $dir -Filter "Uninstall*.exe" | Select-Object -First 1
          if (-not $unins) { throw "uninstaller non trovato in $dir" }
          Start-Process -Wait -FilePath $unins.FullName -ArgumentList "/S"
          # L'uninstaller NSIS si copia in temp ed esce subito: -Wait torna
          # prima che i file spariscano davvero. Poll fino a 60s.
          $exe = Join-Path $dir "GigaMail.exe"
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw "GigaMail.exe ancora presente dopo l'uninstall" }
          Write-Host "uninstall OK"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gigamail-installer
          path: console/dist/GigaMail Setup *.exe
          if-no-files-found: error

name: Release to PyPI

# Pubblicazione via trusted publisher (OIDC): nessun token, nessun segreto
# conservato nel repo. PyPI si fida di questo workflow, in questo repo,
# nell'environment "pypi".
#
# Come si rilascia:
#   1. aggiorna version in pyproject.toml (console e __version__ la seguono
#      da soli), aggiorna CHANGELOG
#   2. tag vX.Y.Z (immutabile: un numero bruciato non si ricicla)
#   3. crea la Release su GitHub da quel tag
#   -> questo workflow costruisce, verifica e pubblica su PyPI, e allega alla
#      Release l'installer Windows con latest.yml (il feed dell'auto-update
#      di electron-updater, provider github)

on:
  release:
    types: [published]
  workflow_dispatch:   # per una prova manuale senza pubblicare

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Test suite (non pubblichiamo codice non verificato)
        run: |
          pip install -e ".[all,dev]"
          pytest -q
          python -m ade_mail_agent.gen_toolmap --check

      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: La versione costruita deve coincidere col tag
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BUILT=$(ls dist/*.tar.gz | sed -E 's/.*gigamail-(.*)\.tar\.gz/\1/')
          echo "tag=$TAG  costruito=$BUILT"
          test "$TAG" = "$BUILT" || {
            echo "::error::Il tag ($TAG) non coincide con la versione del pacchetto ($BUILT)."
            exit 1
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # richiesto dal trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # ── Installer Windows allegato alla Release ────────────────────────────
  # Stessa catena della Desktop build (che ha gia' validato questo commit a
  # ogni push: install, avvio dell'app installata, uninstall). Qui si builda
  # e si allega: GigaMail Setup X.Y.Z.exe, il .blockmap e latest.yml, che
  # electron-updater legge dagli asset della Release piu' recente.
  installer:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write   # gh release upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Dipendenze console
        working-directory: console
        run: |
          npm ci --ignore-scripts
          npx electron-builder install-app-deps
      - name: Python embedded
        run: powershell -ExecutionPolicy Bypass -File console/prepare-python.ps1
      - name: Build installer
        working-directory: console
        run: npm run dist
      - name: La versione dell'installer deve coincidere col tag
        shell: pwsh
        # In dry run (workflow_dispatch) non c'e' un tag: si usa la versione di
        # pyproject.toml, cioe' quella che il tag DOVRA' avere.
        run: |
          $tag = if ("${{ github.event_name }}" -eq "release") {
            "${{ github.event.release.tag_name }}".TrimStart("v")
          } else {
            (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          $exe = "console/dist/GigaMail Setup $tag.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem console/dist; throw "installer per $tag non trovato (tag e pyproject divergono?)" }
          if (-not (Test-Path console/dist/latest.yml)) { throw "latest.yml non generato: manca publish.provider=github?" }
          Write-Host "OK: $exe + latest.yml"
      - name: Allega alla Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          # latest.yml punta a "GigaMail-Setup-X.Y.Z.exe" (spazi -> trattini): gli
          # asset devono chiamarsi cosi', altrimenti electron-updater non li trova
          # (GitHub da solo trasformerebbe gli spazi in punti).
          Get-ChildItem console/dist -File | Where-Object { $_.Name -like "GigaMail Setup *" } | ForEach-Object {
            Rename-Item $_.FullName ($_.Name -replace ' ', '-')
          }
          $files = Get-ChildItem console/dist -File | Where-Object { $_.Name -like "GigaMail-Setup-*" -or $_.Name -eq "latest.yml" } | ForEach-Object { $_.FullName }
          $files | ForEach-Object { Write-Host "  allego $_" }
          gh release upload $tag @files --clobber
          gh release view $tag --json assets -q '.assets[].name'
      - name: Dry run — artifact al posto degli asset
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run
          path: |
            console/dist/GigaMail Setup *.exe
            console/dist/*.blockmap
            console/dist/latest.yml
          if-no-files-found: error

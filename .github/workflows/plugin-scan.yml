name: Plugin Security Scan

# HOL Plugin Scanner (hashgraph-online): manifest, secrets, MCP surface,
# GitHub Actions hygiene, lockfiles. Required for listing in
# awesome-ai-plugins (score >= 80, no critical/high findings).
# Local run: uvx plugin-scanner scan . --profile public-marketplace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@cc22fc7f06702f437990fa89509e0b3c1119eab6 # v1.2.523
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Ruff
        run: |
          pip install ruff
          ruff check src tests
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: ESLint + unit test (console)
        working-directory: console
        run: |
          npm ci --ignore-scripts
          npx eslint .
          npm test

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[all,dev]"
      - name: Test suite
        run: pytest -q
        # I test DPAPI si auto-skippano su Linux; tutto il resto gira
        # su entrambi gli OS senza rete ne' credenziali.
      - name: Tool map allineata al server
        run: python -m ade_mail_agent.gen_toolmap --check

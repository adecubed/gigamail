# Dependabot: keeps the SHA-pinned GitHub Actions and the Python
# dependencies current via pull requests. Actions are pinned to immutable
# commit SHAs in the workflows; this is what moves the pins forward.
# Grouped: one PR per ecosystem per week instead of one per dependency —
# the first run opened five PRs touching the same two files, each
# conflicting with the others after the first merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

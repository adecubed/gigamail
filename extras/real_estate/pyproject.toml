[project]
name = "gigamail-real-estate"
version = "0.1.0"
description = "GigaMail extension for real-estate agencies: flat-type check and unit codes"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = ["gigamail"]

[project.entry-points."gigamail.extensions"]
real_estate = "gigamail_real_estate:RealEstate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gigamail_real_estate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

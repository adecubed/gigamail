<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' file: data: https://fonts.gstatic.com; img-src 'self' file: http://127.0.0.1:* http://localhost:* https: http: data: blob:; connect-src http://127.0.0.1:* http://localhost:*; media-src 'self' file: blob: data: http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"/>
<title>GigaMail</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700&display=swap');
  :root {
    --accent: #eeb9dd;
    --accent-l: #b0c7f4;
    --font: 'Saira','Segoe UI',-apple-system,sans-serif;
  }
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  /* scrollbar sottili come nella finestra principale */
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.15); border-radius:3px; }
  ::-webkit-scrollbar-track { background:transparent; }

  body {
    font-family: var(--font);
    background: #f3e6f0;
    width:100vw; height:100vh;
    overflow:hidden; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
    border:1px solid rgba(0,0,0,0.14);
    border-radius:8px;
  }

  .titlebar{
    height:34px;flex-shrink:0;
    display:flex;align-items:center;padding:0 14px;
    background:#f3e6f0;
    border-bottom:1px solid rgba(0,0,0,0.07);
    -webkit-app-region:drag;user-select:none;
  }
  .tb-title{font-size:11px;color:rgba(0,0,0,0.75);font-weight:500;flex:1;}
  .tb-buttons{display:flex;gap:6px;align-items:center;-webkit-app-region:no-drag;}
  .tb-btn{
    width:28px;height:28px;border-radius:7px;
    background:#f3e6f0;
    border:1px solid rgba(0,0,0,0.14);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;cursor:pointer;
    color:rgba(0,0,0,0.6);
    transition:all 0.15s;flex-shrink:0;
    box-shadow:0 2px 8px rgba(0,0,0,0.07);
  }
  .tb-btn:hover{ box-shadow:0 3px 10px rgba(0,0,0,0.12); }
  .tb-btn.close:hover{background:rgba(220,38,38,0.15);color:#dc2626;}
  .tb-btn.minimize:hover{background:rgba(245,158,11,0.15);color:#d97706;}
  .tb-btn.maximize:hover{background:rgba(34,197,94,0.15);color:#16a34a;}

  .mail-header {
    padding:16px 22px 12px;
    border-bottom:1px solid rgba(0,0,0,0.07);
    background:rgba(255,255,255,0.95);
    flex-shrink:0;
  }
  .mail-subject { font-size:18px; font-weight:600; color:rgba(0,0,0,0.82); letter-spacing:-0.3px; margin-bottom:5px; }
  .mail-from    { font-size:12px; color:rgba(0,0,0,0.6); margin-bottom:8px; }
  .mail-from strong { color:rgba(0,0,0,0.65); }

  .mail-actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .btn {
    padding:5px 11px; border-radius:8px;
    font-size:11px; font-weight:500; font-family:var(--font);
    cursor:pointer; transition:all 0.15s;
    background:rgba(255,255,255,0.95);
    border:1px solid rgba(0,0,0,0.14);
    color:rgba(0,0,0,0.7);
    box-shadow:0 2px 8px rgba(0,0,0,0.07);
  }
  .btn:hover { background:#f3e6f0; box-shadow:0 2px 8px rgba(0,0,0,0.07); }
  .btn-danger { background:rgba(255,255,255,0.95); border-color:rgba(220,38,38,0.75); color:#dc2626; box-shadow:0 4px 14px rgba(220,38,38,0.35); }
  .btn-danger:hover { background:rgba(220,38,38,0.12); box-shadow:0 4px 16px rgba(220,38,38,0.6); border-color:rgba(220,38,38,0.9); }

  .ai-summary {
    margin:10px 22px 0; padding:9px 12px;
    background:rgba(255,255,255,0.95); border:1px solid rgba(0,0,0,0.14);
    border-radius:10px; font-size:11px; color:rgba(0,0,0,0.75);
    display:flex; gap:7px; align-items:flex-start; flex-shrink:0;
    box-shadow:0 2px 8px rgba(0,0,0,0.07);
  }

  .attachments { padding:6px 22px; display:flex; flex-wrap:wrap; gap:6px; flex-shrink:0; }
  .attach-chip {
    display:inline-flex; align-items:center; gap:4px;
    background:#f3e6f0;
    border:1px solid rgba(0,0,0,0.14);
    border-radius:20px; padding:3px 10px;
    font-size:10.5px; color:rgba(0,0,0,0.6);
    box-shadow:0 2px 8px rgba(0,0,0,0.07);
    text-decoration:none; cursor:pointer; transition:all 0.15s;
  }
  .attach-chip:hover { box-shadow:0 2px 8px rgba(0,0,0,0.07); }
  .attach-chip { user-select:none; }

  .attach-menu {
    position:fixed; z-index:9999; min-width:160px;
    background:#fff; border:1px solid rgba(0,0,0,0.14);
    border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.07);
    padding:5px; font-family:inherit;
  }
  .attach-menu-item {
    padding:8px 12px; border-radius:7px; font-size:13px;
    color:rgba(0,0,0,0.8); cursor:pointer; user-select:none;
    transition:background 0.12s; display:flex; align-items:center; gap:8px;
  }
  .attach-menu-item:hover { background:linear-gradient(135deg,rgba(238,185,221,0.35),rgba(176,199,244,0.35)); }

  .mail-body { flex:1; overflow:hidden; position:relative; }
  .mail-body iframe { width:100%; height:100%; border:none; display:block; background:white; }
  .mail-body-text {
    flex:1; overflow-y:auto; padding:18px 22px;
    font-size:13.5px; line-height:1.75; color:rgba(0,0,0,0.65);
  }
  .mail-body-text p { margin-bottom:10px; }

  .mail-footer {
    flex-shrink:0; padding:10px 16px;
    border-top:1px solid rgba(0,0,0,0.07);
    background:#f3e6f0;
  }
  .reply-trigger {
    width:100%; display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.5); border:1px solid rgba(0,0,0,0.14);
    border-radius:16px; padding:9px 14px;
    color:rgba(0,0,0,0.6); font-size:12.5px; font-family:var(--font);
    cursor:pointer; text-align:left; transition:all 0.18s;
    box-shadow:0 2px 8px rgba(0,0,0,0.07);
  }
  .reply-trigger:hover { box-shadow:0 2px 8px rgba(0,0,0,0.07); }
  .reply-icon { font-size:14px; color:rgba(0,0,0,0.6); }

  .loading { flex:1; display:flex; align-items:center; justify-content:center; opacity:0.3; font-size:13px; }
  .hidden { display:none !important; }
</style>
<link rel="stylesheet" href="theme-popup.css"/>
<link rel="stylesheet" href="theme-dark.css"/>
<script src="theme_mode.js"></script>
<script src="dialog.js"></script>
<script src="icons.js"></script>
</head>
<body>

<div class="titlebar">
  <div class="tb-title" id="winTitle" data-i18n="mail_generic">GigaMail</div>
  <div class="tb-buttons">
    <button class="tb-btn" id="btnDockBack" data-i18n-title="dock_back" title="Riporta nella console"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg></button>
    <button class="tb-btn minimize" id="btnMin" data-i18n-title="hide" title="Nascondi"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
    <button class="tb-btn maximize" id="btnMax" data-i18n-title="fullscreen" title="Tutto schermo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    <button class="tb-btn close"   id="btnClose" data-i18n-title="close" title="Chiudi"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
  </div>
</div>

<div id="app" style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0">
  <div class="loading" id="loading" data-i18n="loading">Caricamento…</div>
</div>

<script src="features.js"></script>
<script src="mail_render.js"></script>
<script src="attachment_guard.js"></script>
<script src="mail_window_page.js"></script>
  <script src="i18n.js"></script>
</body>
</html>

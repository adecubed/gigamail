<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file: 'unsafe-inline'; style-src 'self' file: 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' file: data: https://fonts.gstatic.com; img-src 'self' file: http://127.0.0.1:* http://localhost:* https: http: data: blob:; connect-src http://127.0.0.1:* http://localhost:*; media-src 'self' file: blob: data: http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"/>
<title>Chiedi alle mail</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700&display=swap');
  :root {
    --accent: #eeb9dd;
    --accent-l: #b0c7f4;
    --font: 'Saira','Segoe UI',-apple-system,sans-serif;
  }
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100vw; height:100vh; overflow:hidden; }
  /* scrollbar sottili come nella finestra principale */
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.15); border-radius:3px; }
  ::-webkit-scrollbar-track { background:transparent; }

  body {
    font-family: var(--font);
    background: rgba(255,255,255,0.98);
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
    border:1px solid rgba(0,0,0,0.14);
    border-radius:10px;
  }

  .titlebar{
    height:38px;flex-shrink:0;
    display:flex;align-items:center;padding:0 14px;
    background:#f3e6f0;
    border-bottom:1px solid rgba(0,0,0,0.1);
    border-radius:10px 10px 0 0;
    -webkit-app-region:drag;user-select:none;
  }
  .tb-title{font-size:12px;color:rgba(0,0,0,0.75);font-weight:600;flex:1;display:flex;align-items:center;gap:7px;}
  .tb-buttons{display:flex;gap:6px;align-items:center;-webkit-app-region:no-drag;}
  .tb-btn{
    width:28px;height:28px;border-radius:7px;
    background:#f3e6f0;
    border:1px solid rgba(0,0,0,0.14);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;cursor:pointer;
    color:rgba(0,0,0,0.6);transition:all 0.15s;flex-shrink:0;
    box-shadow:0 2px 8px rgba(0,0,0,0.07);
  }
  .tb-btn:hover{ box-shadow:0 3px 10px rgba(0,0,0,0.12); }
  .tb-btn.close:hover{background:rgba(220,38,38,0.15);color:#dc2626;}

  .ask-intro {
    flex-shrink:0; padding:14px 20px 10px;
    border-bottom:1px solid rgba(0,0,0,0.07);
    background:rgba(255,255,255,0.95);
  }
  .ask-intro h2 { font-size:15px; font-weight:600; color:rgba(0,0,0,0.82); margin-bottom:3px; }
  .ask-intro p  { font-size:11px; color:rgba(0,0,0,0.6); }

  .ask-messages {
    flex:1; min-height:0; overflow-y:auto; padding:18px 20px;
    display:flex; flex-direction:column; gap:12px;
    background:rgba(248,250,252,0.6);
  }
  .ask-messages::-webkit-scrollbar { width:4px; }
  .ask-messages::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.15); border-radius:2px; }

  .ask-empty {
    margin:auto; text-align:center; color:rgba(0,0,0,0.55); font-size:13px; max-width:340px; line-height:1.6;
  }
  .ask-empty .ex { display:block; margin-top:10px; font-size:11.5px; color:rgba(0,0,0,0.55); }

  .ask-msg { max-width:80%; padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word; }
  .ask-msg.user {
    align-self:flex-end;
    background:linear-gradient(135deg,var(--accent),var(--accent-l));
    border:1px solid rgba(0,0,0,0.14);
    color:rgba(0,0,0,0.82);
    box-shadow:0 2px 8px rgba(0,0,0,0.07);
  }
  .ask-msg.bot {
    align-self:flex-start;
    background:#ffffff;
    border:1.5px solid rgba(0,0,0,0.18);
    color:rgba(0,0,0,0.78);
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
  }
  .ask-msg.bot.loading { opacity:0.6; font-style:italic; }

  .ask-cited { display:flex; flex-direction:column; gap:5px; margin-top:9px; }
  .ask-cite-chip {
    display:flex; align-items:center; gap:8px;
    background:rgba(176,199,244,0.16);
    border:1px solid rgba(0,0,0,0.15);
    border-radius:8px; padding:6px 10px;
    font-size:11px; cursor:pointer; transition:all 0.15s;
  }
  .ask-cite-chip:hover { background:linear-gradient(135deg,rgba(238,185,221,0.35),rgba(176,199,244,0.35)); }
  .ask-cite-num { font-weight:700; color:var(--accent-l); flex-shrink:0; }
  .ask-cite-body { min-width:0; flex:1; }
  .ask-cite-subj { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ask-cite-from { color:rgba(0,0,0,0.6); font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .ask-input-bar {
    flex-shrink:0; display:flex; gap:8px; padding:12px 16px;
    border-top:1px solid rgba(0,0,0,0.08);
    background:#f3e6f0;
    border-radius:0 0 10px 10px;
  }
  .ask-input {
    flex:1; background:#ffffff;
    border:1px solid rgba(0,0,0,0.14); border-radius:20px;
    padding:9px 16px; font-size:13px; font-family:var(--font);
    color:rgba(0,0,0,0.82); outline:none;
    box-shadow:0 2px 8px rgba(0,0,0,0.07);
  }
  .ask-input::placeholder { color:rgba(0,0,0,0.55); }
  .ask-send {
    width:42px; flex-shrink:0;
    background:#ffffff;
    border:1px solid rgba(0,0,0,0.14); border-radius:50%;
    font-size:17px; cursor:pointer; color:rgba(0,0,0,0.7);
    box-shadow:0 2px 8px rgba(0,0,0,0.07); transition:all 0.15s;
  }
  .ask-send:hover { box-shadow:0 2px 8px rgba(0,0,0,0.07); }
  .ask-send:disabled { opacity:0.5; cursor:not-allowed; }
</style>
</head>
<body>

<div class="titlebar">
  <div class="tb-title">💬 <span data-i18n="ask_title">Chiedi alle tue mail</span></div>
  <div class="tb-buttons">
    <button class="tb-btn minimize" id="btnMin" data-i18n-title="hide" title="Nascondi">▽</button>
    <button class="tb-btn maximize" id="btnMax" data-i18n-title="fullscreen" title="Tutto schermo">□</button>
    <button class="tb-btn close"   id="btnClose" data-i18n-title="close" title="Chiudi">✕</button>
  </div>
</div>

<div class="ask-messages" id="askMessages">
  <div class="ask-empty" id="askEmpty">
    <span data-i18n="ask_empty_title">Chiedimi qualcosa sulle tue mail.</span>
    <span class="ex" data-i18n="ask_example">Es: "trova le mail dove ho parlato di Cézanne" poi "fammi un riassunto"</span>
  </div>
</div>

<div class="ask-input-bar">
  <input type="text" id="askInput" class="ask-input" data-i18n-ph="ask_placeholder" placeholder="Chiedi qualcosa sulle tue mail…" autocomplete="off"/>
  <button class="ask-send" id="askSend">→</button>
</div>

<script>
const API = window.GIGAMAIL_API || 'http://127.0.0.1:8002';
let accountId = null;
let history = [];

const messages = document.getElementById('askMessages');
const input = document.getElementById('askInput');
const sendBtn = document.getElementById('askSend');
const emptyEl = document.getElementById('askEmpty');

// Ricevi account_id dalla finestra principale
if (window.askWindowAPI) {
  window.askWindowAPI.onLoad((data) => {
    accountId = data?.account_id ?? null;
  });
}

document.getElementById('btnClose').addEventListener('click', () => window.askWindowAPI?.close());
document.getElementById('btnMin').addEventListener('click',   () => window.askWindowAPI?.minimize());
document.getElementById('btnMax').addEventListener('click',   () => window.askWindowAPI?.maximize());

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function addMsg(text, role, cited){
  if (emptyEl) emptyEl.style.display = 'none';
  const div = document.createElement('div');
  div.className = `ask-msg ${role}`;
  div.textContent = text;
  if (cited && cited.length){
    const box = document.createElement('div');
    box.className = 'ask-cited';
    cited.forEach((c, i) => {
      const chip = document.createElement('div');
      chip.className = 'ask-cite-chip';
      chip.innerHTML = `<span class="ask-cite-num">[${i+1}]</span>
        <div class="ask-cite-body">
          <div class="ask-cite-subj">${esc(c.subject)}</div>
          <div class="ask-cite-from">${esc(c.sender)}</div>
        </div>`;
      chip.addEventListener('click', () => {
        if (c.message_id) {
          window.askWindowAPI?.openMail({ id: c.message_id, folder: c.folder, account_id: c.account_id || accountId });
        }
      });
      box.appendChild(chip);
    });
    div.appendChild(box);
  }
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function send(){
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  addMsg(q, 'user');
  history.push({ role:'user', content:q });
  sendBtn.disabled = true;
  const loading = addMsg(window.i18n?window.i18n.t('searching'):'Sto cercando…', 'bot');
  loading.classList.add('loading');
  try {
    const r = await fetch(`${API}/mail_ask`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question:q, account_id:accountId, history, lang:(window.i18n?window.i18n.lang:(localStorage.getItem('ade_lang')||'it')) })
    });
    const d = await r.json();
    loading.remove();
    addMsg(d.answer || (window.i18n?window.i18n.t('no_answer'):'(nessuna risposta)'), 'bot', d.cited_mails);
    history.push({ role:'assistant', content:d.answer||'', cited_thread_ids:d.cited_thread_ids||[] });
    if (history.length > 20) history = history.slice(-20);  // tieni ultimi ~10 scambi (user+bot)
  } catch(e) {
    loading.remove();
    addMsg((window.i18n?window.i18n.t('error'):'Errore') + ': ' + e.message, 'bot');
  }
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
input.focus();
</script>
  <script src="i18n.js"></script>
</body>
</html>

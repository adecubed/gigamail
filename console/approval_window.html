<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' file: data: https://fonts.gstatic.com; img-src 'self' file: data:; connect-src http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"/>
<title data-i18n="aw_title">Richiesta da approvare</title>
<style>
  :root { --font:'Segoe UI',-apple-system,sans-serif; }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.15); border-radius:3px; }
  body{ font-family:var(--font); width:100vw; height:100vh; overflow:hidden; display:flex; flex-direction:column;
    border:2px solid rgba(0,0,0,0.85); border-radius:8px; -webkit-font-smoothing:antialiased; }
  .titlebar{ height:34px; flex-shrink:0; display:flex; align-items:center; padding:0 14px; -webkit-app-region:drag; user-select:none; border-radius:6px 6px 0 0; }
  .tb-title{ font-size:11px; font-weight:600; flex:1; }
  .tb-buttons{ display:flex; gap:6px; -webkit-app-region:no-drag; }
  .tb-btn{ width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; background:transparent; }
  .fields{ padding:12px 16px 10px; display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
  .row{ display:flex; gap:8px; font-size:12.5px; }
  .field-label{ width:60px; flex-shrink:0; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .field-value{ flex:1; min-width:0; word-break:break-word; }
  .state{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .state.ok{ color:#16a34a; } .state.err{ color:#dc2626; } .state.warn{ color:var(--gm-amber,#b26f00); }
  .body{ flex:1; min-height:0; overflow:auto; padding:12px 16px; font-size:14.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word; border-top:1px solid var(--gm-line,#e6e6ec); }
  .edit{ display:none; padding:8px 16px; border-top:1px solid var(--gm-line,#e6e6ec); flex-shrink:0; }
  .edit.visible{ display:block; }
  .edit textarea{ width:100%; height:70px; resize:none; font:inherit; font-size:13px; padding:8px 10px; border-radius:10px; border:1.5px solid var(--gm-line,#e6e6ec); outline:none; }
  .toolbar{ display:flex; gap:8px; align-items:center; padding:10px 14px; flex-shrink:0; border-top:1px solid var(--gm-line,#e6e6ec); }
  .status{ flex:1; font-size:12px; min-width:0; }
  .btn{ padding:8px 14px; border-radius:10px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; border:1.5px solid var(--gm-line,#e6e6ec); background:transparent; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .send-btn{ padding:8px 16px; border-radius:10px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; border:none; }
  .send-btn:disabled{ opacity:.6; cursor:default; }
  .hint{ font-size:11.5px; opacity:.75; }
</style>
<link rel="stylesheet" href="theme-popup.css"/>
<link rel="stylesheet" href="theme-dark.css"/>
<script src="theme_mode.js"></script>
<script src="icons.js"></script>
</head>
<body>
<div class="titlebar">
  <div class="tb-title" id="title" data-i18n="aw_title">Richiesta da approvare</div>
  <div class="tb-buttons">
    <button class="tb-btn minimize" id="btnMin" title="Nascondi" data-i18n-title="hide"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
    <button class="tb-btn close" id="btnClose" title="Chiudi" data-i18n-title="close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
  </div>
</div>
<div class="fields">
  <div class="row"><span class="field-label" id="lblState" data-i18n="aw_state">Stato</span><span class="field-value state" id="state"></span></div>
  <div class="row"><span class="field-label" data-i18n="aw_tool">Azione</span><span class="field-value" id="tool"></span></div>
  <div class="row" id="rowFrom"><span class="field-label" data-i18n="detail_from">Da</span><span class="field-value" id="from"></span></div>
  <div class="row" id="rowTo"><span class="field-label" data-i18n="detail_to">A</span><span class="field-value" id="to"></span></div>
  <div class="row" id="rowSubject"><span class="field-label" data-i18n="detail_subject">Oggetto</span><span class="field-value" id="subject"></span></div>
  <div class="row" id="rowAtt"><span class="field-label" data-i18n="detail_attachments">Allegati</span><span class="field-value" id="attachments"></span></div>
</div>
<div class="body" id="body"></div>
<div class="edit" id="editBox">
  <div class="hint" data-i18n="aw_edit_hint">Cosa cambiare? La richiesta viene chiusa e la bozza riscritta con la tua nota.</div>
  <textarea id="note" data-i18n-ph="aw_edit_ph" placeholder="per esempio: più breve, e con il prezzo"></textarea>
</div>
<div class="toolbar">
  <div class="status" id="status"></div>
  <button class="btn" id="btnEdit" data-i18n="aw_edit">Modifica</button>
  <button class="btn btn-danger" id="btnReject" data-i18n="aw_reject">Rifiuta</button>
  <button class="send-btn" id="btnApprove" data-i18n="aw_approve">Approva</button>
</div>
<script src="approval_window_page.js"></script>
<div id="resizeHandle" style="position:fixed;bottom:0;right:0;width:18px;height:18px;cursor:nwse-resize;z-index:9999;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,0.2) 50%);border-radius:0 0 8px 0;"></div>
<script src="window_resize.js" data-api="approvalWindowAPI" data-min-w="420" data-min-h="360"></script>
<script src="i18n.js"></script>
</body>
</html>

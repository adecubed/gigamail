[project]
name = "ade-mail-agent"
version = "0.1.0"
description = "ADE Mail Agent — server MCP per dare al tuo agente AI accesso sicuro e controllato alla posta (Microsoft Graph + IMAP) e al calendario."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "msal>=1.28",
    "requests>=2.31",
    "cryptography>=42",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "caldav>=1.3",
    "icalendar>=5.0",
    "numpy>=1.26",
]

[project.scripts]
ade-mail-agent = "ade_mail_agent.cli:main"
ade-mail-agent-server = "ade_mail_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ade_mail_agent"]
